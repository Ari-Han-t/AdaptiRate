[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptirate"
version = "0.1.0"
description = "Python SDK for AdaptiRate, the adaptive distributed rate limiter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]
keywords = ["rate-limiting", "rate-limiter", "redis", "fastapi", "django", "flask", "adaptive", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Framework :: FastAPI",
    "Framework :: Django",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/Ari-Han-t/AdaptiRate"
Documentation = "https://github.com/Ari-Han-t/AdaptiRate/tree/main/docs"
Source = "https://github.com/Ari-Han-t/AdaptiRate/tree/main/sdk-python"
Issues = "https://github.com/Ari-Han-t/AdaptiRate/issues"

[project.optional-dependencies]
# Report this host's CPU and memory to the adaptive engine.
host = ["psutil>=6.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["adaptirate*"]

[tool.setuptools.package-data]
adaptirate = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
