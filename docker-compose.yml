name: adaptirate

x-api-env: &api-env
  AR_ENV: ${AR_ENV:-prod}
  AR_JWT_SECRET: ${AR_JWT_SECRET:?set AR_JWT_SECRET in .env (see .env.example)}
  AR_DATABASE_URL: postgresql+asyncpg://adaptirate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/adaptirate
  AR_REDIS_URL: redis://redis:6379/0
  AR_BOOTSTRAP_ADMIN_EMAIL: ${AR_BOOTSTRAP_ADMIN_EMAIL:-}
  AR_BOOTSTRAP_ADMIN_PASSWORD: ${AR_BOOTSTRAP_ADMIN_PASSWORD:-}
  AR_CORS_ORIGINS: ${AR_CORS_ORIGINS:-}
  AR_COOKIE_SECURE: ${AR_COOKIE_SECURE:-false}
  AR_TRUSTED_PROXIES: ${AR_TRUSTED_PROXIES:-172.16.0.0/12}
  AR_METRICS_TOKEN: ${AR_METRICS_TOKEN:-}
  AR_EVENTS_PER_SECOND: ${AR_EVENTS_PER_SECOND:-100}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adaptirate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adaptirate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptirate -d adaptirate"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./adaptirate
      dockerfile: ../docker/api.Dockerfile
      target: runtime
    image: adaptirate-api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: adaptirate-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${AR_API_WORKERS:-2}", "--no-access-log"]
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: adaptirate-api
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/dashboard.Dockerfile
    image: adaptirate-dashboard
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  # Demo: a FastAPI store that uses the Python SDK, plus a traffic generator.
  #   docker compose --profile demo up --build
  demo-app:
    build:
      context: .
      dockerfile: examples/fastapi/Dockerfile
    image: adaptirate-demo
    profiles: ["demo"]
    environment:
      ADAPTIRATE_URL: http://api:8000
      ADAPTIRATE_ADMIN_EMAIL: ${AR_BOOTSTRAP_ADMIN_EMAIL:-}
      ADAPTIRATE_ADMIN_PASSWORD: ${AR_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  demo-load:
    image: adaptirate-demo
    profiles: ["demo"]
    command: ["python", "load.py"]
    environment:
      TARGET: http://demo-app:8090
    depends_on:
      - demo-app
    restart: unless-stopped

  # Development and CI: source mounted, dev dependencies installed.
  dev:
    build:
      context: ./adaptirate
      dockerfile: ../docker/api.Dockerfile
      target: dev
    image: adaptirate-api-dev
    profiles: ["dev"]
    working_dir: /srv
    volumes:
      - ./adaptirate:/srv
    environment:
      AR_ENV: test
      AR_JWT_SECRET: test-secret-test-secret-test-secret-0123456789
      AR_DATABASE_URL: postgresql+asyncpg://adaptirate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/adaptirate_test
      AR_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # End-to-end acceptance suite. Run it with:  bash acceptance/run.sh
  # `acceptance/.run/env` is generated by `runner.py setup` (API key and policy names).
  orders-api: &acceptance-orders
    build:
      context: .
      dockerfile: acceptance/services/orders_api/Dockerfile
    image: adaptirate-acceptance-orders
    profiles: ["acceptance"]
    env_file: ./acceptance/.run/env
    environment:
      ADAPTIRATE_URL: http://api:8000
      # Name of the variable (in acceptance/.run/env) that holds this service's policy.
      ORDERS_POLICY_VAR: ACC_ORDERS_POLICY
    deploy:
      replicas: 3

  orders-adaptive:
    <<: *acceptance-orders
    environment:
      ADAPTIRATE_URL: http://api:8000
      ORDERS_POLICY_VAR: ACC_ADAPTIVE_POLICY

  llm-gateway:
    build:
      context: .
      dockerfile: acceptance/services/llm_gateway/Dockerfile
    image: adaptirate-acceptance-gateway
    profiles: ["acceptance"]
    env_file: ./acceptance/.run/env
    environment:
      ADAPTIRATE_URL: http://api:8000
      PROVIDER_URL: http://fake-provider:9000
      USE_ADAPTIRATE: "true"

  fake-provider:
    build:
      context: .
      dockerfile: acceptance/services/fake_provider/Dockerfile
    image: adaptirate-acceptance-provider
    profiles: ["acceptance"]
    environment:
      QUOTA_PER_MINUTE: "60"

  acceptance-runner:
    build:
      context: ./acceptance
      dockerfile: Dockerfile.runner
    image: adaptirate-acceptance-runner
    profiles: ["acceptance"]
    working_dir: /acceptance
    volumes:
      - ./acceptance:/acceptance
    environment:
      ADAPTIRATE_URL: http://api:8000
      ADAPTIRATE_ADMIN_EMAIL: ${AR_BOOTSTRAP_ADMIN_EMAIL:-}
      ADAPTIRATE_ADMIN_PASSWORD: ${AR_BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["python", "runner.py", "--help"]

volumes:
  pgdata:
